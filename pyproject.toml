[project]
name = "cell-context-model"
version = "0.0.1"
description = "Learning how genes and cells influence each other across diverse cellular contexts."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
]

[project.optional-dependencies]
census = ["cellxgene-census>=1.18"]
h5ad = ["anndata>=0.10", "h5py>=3.10"]
hf = ["huggingface_hub>=0.24", "fsspec>=2024.2"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ccm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
